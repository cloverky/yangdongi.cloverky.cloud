services:
  mysql:
    image: mysql:8.0
    container_name: dmu-mysql
    restart: unless-stopped
    # app.py가 auth_plugin=mysql_native_password로 접속한다
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: dmupass
      MYSQL_DATABASE: dmu
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 빈 볼륨일 때만 01→02→03 순서로 실행된다
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdmupass"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:7
    container_name: dmu-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  web:
    image: python:3.11-slim
    container_name: dmu-web
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mongo:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      # 호스트 8001은 wslrelay가 선점 중이라 8081을 쓴다
      - "8081:8001"
    volumes:
      - ../front:/app
    command: >
      sh -c "pip install --no-cache-dir -q -r requirements.txt && python app.py"

volumes:
  mysql-data:
  mongo-data:
